<div class="font-condensed text-gray-800">
  <div class="relative h-screen min-h-[600px] w-full overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img src="images/pizza.png" alt="Pizza Background" class="h-full w-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-b from-black/70 to-transparent"></div>
    </div>

    <div class="relative z-10 flex h-full flex-col items-center justify-center px-4 text-center">
      <div class="mb-1">
        <img src="images/Vector.svg" alt="Fuoco Icon" class="h-12 w-auto" />
      </div>

      <h1
        class="antialiased mb-8 max-w-5xl font-condensed leading-[0.9] text-[#FCFBF7] uppercase drop-shadow-lg text-[50px] md:text-[140px]"
      >
        {{ 'HOME.HERO.TITLE_L1' | translate }}<br />
        {{ 'HOME.HERO.TITLE_L2' | translate }}
      </h1>

      <button
        routerLink="/menu"
        class="antialiased bg-[#FCFBF7] px-8 py-3 font-condensed uppercase text-[#B93622] transition hover:bg-gray-100 text-[18px] md:text-[22px]"
      >
        {{ 'HOME.HERO.CTA' | translate }}
      </button>
    </div>
  </div>

  <section class="flex justify-center bg-[#FCFBF7] px-4 py-20">
    <div class="w-full text-center px-4">
      <p
        class="antialiased font-condensed uppercase text-[#B93622] leading-[0.9] text-[22px] md:text-[32px] lg:text-[30px]"
      >
        {{ 'HOME.CLAIM' | translate }}
      </p>
    </div>
  </section>

  <section class="grid w-full grid-cols-1 mb-16 md:grid-cols-2">
    <div class="h-96 w-full md:h-[585px]">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2831.984115264695!2d10.317453376680776!3d44.781129178753886!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47806b16a52be9c9%3A0x5fcd68648fb9c6eb!2sStr.%20Montanara%2C%2015%2C%2043124%20Parma%20PR!5e0!3m2!1sit!2sit!4v1770413518194!5m2!1sit!2sit"
        width="100%"
        height="100%"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        class="h-full w-full object-cover"
      >
      </iframe>
    </div>

    <div
      class="flex flex-col items-center justify-center bg-[#B93622] px-6 py-16 text-center text-[#FCFBF7] md:h-[585px] md:px-8 md:py-0"
    >
      <h2 class="antialiased mb-6 font-condensed uppercase leading-tight text-[35px] md:text-[55px]">
        {{ 'HOME.MAPPA.TITLE_L1' | translate }}<br />
        {{ 'HOME.MAPPA.TITLE_L2' | translate }}
      </h2>

      <button
        (click)="goToLink(url)"
        class="mt-2 bg-[#FCFBF7] font-condensed uppercase text-[#B93622] hover:bg-gray-100 w-full py-4 text-[20px] md:w-auto md:px-10 md:py-4 md:text-[24px]"
      >
        {{ 'HOME.MAPPA.CTA' | translate }}
      </button>
    </div>
  </section>
</div>
